<VirtualHost *:80>
  
   ServerName localhost
   ServerAlias www.localhost

#   Redirect / https://localhost.local

   DocumentRoot "/var/www/html/public"

   ErrorLog "/var/log/apache2/localhost-error.log"
   CustomLog "/var/log/apache2/localhost-custom.log" common

   <Directory "/var/www/html/public/">
      Options Indexes FollowSymLinks
      AllowOverride All
      Order allow,deny
      Allow from all
      ReWriteEngine On
   </Directory>

   Alias /css /var/www/html/css
   Alias /js /var/www/html/js
   Alias /images /var/www/html/images
   Alias /fonts /var/www/html/fonts
   Alias /img /var/www/html/images
   Alias /ico /var/www/html/ico

   <Directory "/var/www/html/css">
      Require all granted
   </Directory>
   <Directory "/var/www/html/js">
      Require all granted
   </Directory>
   <Directory "/var/www/html/images">
      Require all granted
   </Directory>
   <Directory "/var/www/html/fonts">
      Require all granted
   </Directory>
   <Directory "/var/www/html/ico">
      Require all granted
   </Directory>

 </VirtualHost>

<VirtualHost *:443>
  
   ServerName localhost.local
   ServerAlias www.localhost

   SSLEngine On
   SSLCertificateFile /etc/ssl/certs/localhost.crt
   SSLCertificateKeyFile /etc/ssl/private/localhost.key

   DocumentRoot "/var/www/html/public"

   ErrorLog "/var/log/apache2/localhost-ssl-error.log"
   CustomLog "/var/log/apache2/localhost-ssl-custom.log" common

   <Directory "/var/www/html/public">
      Options Indexes FollowSymLinks
      AllowOverride All 
      Order allow,deny 
      Allow from all 
      ReWriteEngine On
   </Directory>

   Alias /css /var/www/html/css
   Alias /js /var/www/html/js
   Alias /images /var/www/html/images
   Alias /fonts /var/www/html/fonts
   Alias /img /var/www/html/images
   Alias /ico /var/www/html/ico

   <Directory "/var/www/html/css">
      Require all granted
   </Directory>
   <Directory "/var/www/html/js">
      Require all granted
   </Directory>
   <Directory "/var/www/html/images">
      Require all granted
   </Directory>
   <Directory "/var/www/html/fonts">
      Require all granted
   </Directory>
   <Directory "/var/www/html/ico">
      Require all granted
   </Directory>

</VirtualHost>
